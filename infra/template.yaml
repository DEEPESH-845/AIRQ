AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AIRQ - India's air, live. WorldTick (EventBridge Scheduler -> Step Functions -> Lambda) rebuilds
  world.json from CAMS, Open-Meteo wind and NASA FIRMS; S3 + CloudFront serve the app; smog raids
  fan out through EventBridge to SNS.
  Physical names stay arq-* from before the AIRQ rename; changing them would replace live resources.

Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email for budget alerts (monthly budget of $15). Leave empty to skip.

  VapidPublicKey:
    Type: String
    Default: ''
  VapidPrivateKey:
    Type: String
    NoEcho: true
    Default: ''
  CertSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: HMAC key that signs impact certificates (generated by deploy.sh into .cert-secret)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

Resources:
  # ---------------------------------------------------------------- storage + delivery
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub arq-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-archive
            Prefix: archive/
            Status: Enabled
            ExpirationInDays: 90

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub arq-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub arq-data-${AWS::StackName}
        MinTTL: 0
        DefaultTTL: 300
        MaxTTL: 600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AIRQ web app
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200 # includes edge locations in India
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub ${PushApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          - PathPattern: data/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref DataCachePolicy
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- the game tick
  TickFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: arq-world-tick
      CodeUri: ../build/tick
      Handler: tick.handler
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          AIRQ_BUCKET: !Ref SiteBucket
          AIRQ_GEO: /var/task/geo
          AIRQ_CACHE: /tmp/cache
      Policies:
        - S3CrudPolicy: { BucketName: !Ref SiteBucket }

  TickLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/arq-world-tick
      RetentionInDays: 14

  WorldTick:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: arq-worldtick
      Type: STANDARD # a paced tick takes ~3-4 min, beyond Express's 5-min cap once retries are counted
      Tracing: { Enabled: true }
      Logging:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup: { LogGroupArn: !GetAtt TickLogs.Arn }
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref TickFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref PlayerFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref PushFunction }
        - EventBridgePutEventsPolicy: { EventBusName: default }
        - CloudWatchLogsFullAccess
      Events:
        Every4Hours:
          Type: ScheduleV2
          Properties:
            # Open-Meteo's free tier is ~10k location-calls a day; one tick is ~1.3k
            ScheduleExpression: rate(4 hours)
            RetryPolicy: { MaximumRetryAttempts: 1 }
      DefinitionSubstitutions:
        TickArn: !GetAtt TickFunction.Arn
        PlayerArn: !GetAtt PlayerFunction.Arn
        PushArn: !GetAtt PushFunction.Arn
      Definition:
        Comment: Fetch feeds, rebuild the world, check Fire Watch fields, alert fires near watched districts, announce smog raids
        StartAt: BuildWorld
        States:
          BuildWorld:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${TickArn}
            OutputPath: $.Payload
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, States.Timeout]
                IntervalSeconds: 20
                MaxAttempts: 2
                BackoffRate: 2
            Next: FireWatch
          # both side jobs keep the tick's output ($.raids) and never fail the tick
          FireWatch:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${PlayerArn}
              Payload: { job: fieldwatch }
            ResultPath: null
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: FireAlerts
            Next: FireAlerts
          FireAlerts:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${PushArn}
              Payload: { job: fires }
            ResultPath: null
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: AnyRaids
            Next: AnyRaids
          AnyRaids:
            Type: Choice
            Choices:
              - Variable: $.raids[0]
                IsPresent: true
                Next: AnnounceRaids
            Default: Done
          AnnounceRaids:
            Type: Map
            ItemsPath: $.raids
            MaxConcurrency: 10
            ItemProcessor:
              ProcessorConfig: { Mode: INLINE }
              StartAt: PutRaidEvent
              States:
                PutRaidEvent:
                  Type: Task
                  Resource: arn:aws:states:::events:putEvents
                  Parameters:
                    Entries:
                      - Source: airq.world
                        DetailType: SmogRaid
                        Detail.$: $
                  End: true
            ResultPath: null
            Next: Done
          Done:
            Type: Succeed

  # ---------------------------------------------------------------- raid fan-out
  RaidTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: arq-smog-raids

  RaidTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref RaidTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref RaidTopic

  RaidRule:
    Type: AWS::Events::Rule
    Properties:
      Name: arq-smog-raid
      Description: Every SmogRaid from WorldTick goes to the raid topic (web push subscribers hang off it)
      EventPattern:
        source: [airq.world]
        detail-type: [SmogRaid]
      Targets:
        - Id: raid-topic
          Arn: !Ref RaidTopic

  # ---------------------------------------------------------------- web push alerts
  Subscriptions:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arq-push-subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: d, AttributeType: S }
        - { AttributeName: e, AttributeType: S }
      KeySchema:
        - { AttributeName: d, KeyType: HASH }
        - { AttributeName: e, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  PushApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: arq-push
      CodeUri: push/
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE: !Ref Subscriptions
          VAPID_SUBJECT: mailto:deepesh.mgn@gmail.com
          VAPID_PUBLIC: !Ref VapidPublicKey
          VAPID_PRIVATE: !Ref VapidPrivateKey
          BUCKET: !Ref SiteBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Subscriptions }
        - S3ReadPolicy: { BucketName: !Ref SiteBucket }
      Events:
        Subscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref PushApi, Path: /api/subscribe, Method: POST }
        Unsubscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref PushApi, Path: /api/subscribe, Method: DELETE }
        Raids:
          Type: SNS
          Properties: { Topic: !Ref RaidTopic }

  # ---------------------------------------------------------------- the General (Strands on Bedrock)
  GeneralQuota:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arq-general-quota
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: k, AttributeType: S }]
      KeySchema: [{ AttributeName: k, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  GeneralFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: arq-general
      CodeUri: ../build/general
      Handler: app.handler
      MemorySize: 1024
      Timeout: 29 # API Gateway HTTP APIs cap integrations at 30 s
      Environment:
        Variables:
          AIRQ_BUCKET: !Ref SiteBucket
          QUOTA_TABLE: !Ref GeneralQuota
          MODEL_ID: us.amazon.nova-micro-v1:0 # cheapest Bedrock model that handles the tool calls; no Marketplace subscription
          DAILY_QUESTIONS: '10'
      Policies:
        - S3CrudPolicy: { BucketName: !Ref SiteBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref GeneralQuota }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.*
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Ask:
          Type: HttpApi
          Properties: { ApiId: !Ref PushApi, Path: /api/general, Method: POST }

  # ---------------------------------------------------------------- players: proofs, credits, shop, leaderboard
  Players:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arq-players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pid, AttributeType: S }]
      KeySchema: [{ AttributeName: pid, KeyType: HASH }]

  Proofs:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arq-proofs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  ProofBucket: # private: proof photos are never served, only kept for audit
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub arq-proofs-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-proofs
            Status: Enabled
            ExpirationInDays: 90

  PlayerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: arq-player
      CodeUri: ../build/player
      Handler: app.handler
      MemorySize: 1024 # Pillow decodes and fingerprints every proof photo
      Timeout: 29
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref Players
          PROOFS_TABLE: !Ref Proofs
          PROOF_BUCKET: !Ref ProofBucket
          SITE_BUCKET: !Ref SiteBucket
          VISION_MODEL: us.amazon.nova-lite-v1:0 # multimodal, first-party: checks proof photos
          CERT_SECRET: !Ref CertSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Players }
        - DynamoDBCrudPolicy: { TableName: !Ref Proofs }
        - S3CrudPolicy: { BucketName: !Ref ProofBucket }
        - S3ReadPolicy: { BucketName: !Ref SiteBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Enlist: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/player, Method: POST } }
        Sync: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/player/sync, Method: POST } }
        Forget: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/player/delete, Method: POST } }
        Proof: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/proof, Method: POST } }
        Shop: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/shop, Method: POST } }
        Board: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/leaderboard, Method: GET } }
        Challenge: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/proof/challenge, Method: POST } }
        Feed: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/feed, Method: GET } }
        Field: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/field, Method: POST } }
        FieldCheck: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/field/check, Method: POST } }
        CertIssue: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/cert, Method: POST } }
        CertVerify: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/cert, Method: GET } }
        TeamPost: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/team, Method: POST } }
        TeamGet: { Type: HttpApi, Properties: { ApiId: !Ref PushApi, Path: /api/team, Method: GET } }

  # ---------------------------------------------------------------- cost guardrail
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: arq-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 15, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  Bucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  WorldTickArn:
    Value: !Ref WorldTick
  RaidTopicArn:
    Value: !Ref RaidTopic
